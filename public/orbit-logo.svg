<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-label="Orbit logo">
  <defs>
    <linearGradient id="arcGrad" x1="340" y1="80" x2="490" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a4f8f"/>
      <stop offset="100%" stop-color="#63d9e0"/>
    </linearGradient>
    <style>
      .ring { fill: none; stroke: #262838; stroke-width: 3; }
      .spinner { animation: spin360 2.6s cubic-bezier(0.65, 0, 0.35, 1) 1 forwards; transform-origin: 340px 240px; }
      .arc { fill: none; stroke: url(#arcGrad); stroke-width: 20; stroke-linecap: round; }
      .dot-core { fill: #4a4f8f; }
      .dot-head { fill: #63d9e0; }
      @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="480" fill="#14151f"/>
  <circle cx="340" cy="240" r="160" class="ring"/>

  <g class="spinner">
    <path d="M 340 80 A 160 160 0 0 1 490 295" class="arc"/>
    <circle cx="340" cy="80" r="24" class="dot-core"/>
    <circle cx="490" cy="295" r="30" class="dot-head"/>
  </g>
</svg>

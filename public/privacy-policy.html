<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy - EVV</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="legal-page.js"></script>
</head>
<body class="legal-page-shell" data-legal-doc="privacy">
  <main class="legal-page">
    <button class="legal-back-button" type="button" data-legal-back aria-label="Go back">←</button>
    <section class="legal-document-card">
      <div class="legal-document-content" id="legalDocumentContent" aria-live="polite"></div>
      <div class="legal-document-actions">
        <button class="btn-primary legal-agree-button" type="button" data-legal-agree>I Agree</button>
      </div>
    </section>
  </main>
</body>
</html>
